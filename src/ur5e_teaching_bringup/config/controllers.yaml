# ros2_control configuration for the UR5e teaching sim.
# sim.launch.py adds `params_file: <this file>` to every controller entry at launch time, because
# ros2_control 6.10.1 only passes parameters to a controller node through that key (see NOTES.md).
#
# Interface ownership (only one active controller may claim a command interface):
#   joint_trajectory_controller         -> <joint>/position   (stock, used for bringup and homing)
#   pid_ff_trajectory_controller        -> <joint>/effort     (mode: track)
#   gravity_comp_handguide_controller   -> <joint>/effort     (mode: handguide)
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz; gz_ros2_control runs at this rate on a 1 ms physics step

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    pid_ff_trajectory_controller:
      type: ur5e_teaching_controllers/PidFfTrajectoryController

    gravity_comp_handguide_controller:
      type: ur5e_teaching_controllers/GravityCompHandGuidingController
      # If hand guiding trips its speed cap (update() returns ERROR), the controller_manager
      # activates the tracking controller, which holds the joints where they are instead of
      # leaving them limp. The fallback must be loaded and configured (mode_manager does that).
      fallback_controllers: [pid_ff_trajectory_controller]

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: tcp_fts_sensor
    frame_id: wrist_3_link

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
      shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
      elbow_joint: {trajectory: 0.2, goal: 0.1}
      wrist_1_joint: {trajectory: 0.2, goal: 0.1}
      wrist_2_joint: {trajectory: 0.2, goal: 0.1}
      wrist_3_joint: {trajectory: 0.2, goal: 0.1}

# Gains: critically damped PD at ~20 rad/s (base) / ~30 rad/s (wrist) for the joint-space inertia
# at the home pose, M_jj from Pinocchio = [1.06, 2.59, 0.88, 0.023, 0.0054, 0.0003] kg m^2;
# integral time 0.5 s. The wrist_3 gains are tiny because its inertia is: with kd * dt / I > 1 the
# explicit 2 ms loop would go unstable. See docs/controllers.md.
pid_ff_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    tip_frame: tool0
    kp: [600.0, 1200.0, 500.0, 30.0, 8.0, 0.5]
    kd: [50.0, 100.0, 40.0, 1.5, 0.3, 0.02]
    ki: [1200.0, 2400.0, 1000.0, 60.0, 16.0, 1.0]
    i_clamp: [75.0, 75.0, 75.0, 14.0, 14.0, 14.0]
    max_velocity: [1.5, 1.5, 1.5, 2.0, 2.0, 2.0]
    max_acceleration: [4.0, 4.0, 4.0, 6.0, 6.0, 6.0]
    feedforward: true
    payload_mass: 0.0
    payload_com: [0.0, 0.0, 0.03]
    state_publish_decimation: 1

gravity_comp_handguide_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    tip_frame: tool0
    payload_mass: 0.0
    payload_com: [0.0, 0.0, 0.03]
    coriolis_compensation: true
    damping: [8.0, 8.0, 5.0, 2.0, 1.0, 0.05]
    limit_margin: 0.2
    limit_stiffness: 50.0
    max_joint_velocity: [1.5, 1.5, 1.5, 2.0, 2.0, 2.0]
    state_publish_decimation: 1
